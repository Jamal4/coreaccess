<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f12">
<title>Core Access · Office</title>
<style>
:root{
  --bg:#0b0f12; --bg2:#0f1519; --card:#141b20; --card2:#1a232a; --line:#26323b; --line2:#33424d;
  --text:#e7eef2; --muted:#8fa1ad; --dim:#5f707c;
  --teal:#14b8a6; --teal2:#2dd4bf; --tealbg:rgba(20,184,166,.12);
  --amber:#f59e0b; --amberbg:rgba(245,158,11,.12);
  --red:#f43f5e; --redbg:rgba(244,63,94,.12);
  --violet:#a78bfa; --violetbg:rgba(167,139,250,.12);
  --sky:#38bdf8; --skybg:rgba(56,189,248,.12);
  --orange:#fb923c; --orangebg:rgba(251,146,60,.12);
  --green:#4ade80; --greenbg:rgba(74,222,128,.12);
  --r:14px; --r2:10px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body{font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r2);
  border:1px solid transparent;font-weight:600;letter-spacing:.2px;cursor:pointer;transition:transform .06s,background .15s,border-color .15s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.inp:focus-visible,.tile:focus-visible,.iconbtn:focus-visible,.seg button:focus-visible{outline:2px solid var(--teal2);outline-offset:2px}
.btn-primary{background:linear-gradient(180deg,var(--teal2),var(--teal));color:#04201d;box-shadow:0 6px 18px rgba(20,184,166,.25)}
.btn-primary:hover{box-shadow:0 8px 24px rgba(20,184,166,.38)}
.btn-ghost{background:transparent;border-color:var(--line2);color:var(--text)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal2)}
.btn-danger{background:var(--redbg);border-color:rgba(244,63,94,.45);color:#fda4af}
.btn[disabled]{opacity:.5;cursor:default}
.btn-block{width:100%}
.btn-sm{height:34px;padding:0 11px;font-size:13px;border-radius:9px;gap:6px}
.btn-sm svg.i{width:16px;height:16px}
.spin{width:18px;height:18px;border:2.5px solid rgba(4,32,29,.25);border-top-color:#04201d;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--teal2);border-color:var(--teal)}

/* ---------- form fields ---------- */
.fld{display:block;margin-bottom:16px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.2px}
.fld>small{display:block;color:var(--dim);font-size:12px;margin-top:5px}
.inwrap{position:relative;display:flex;align-items:center}
.inwrap>svg.i{position:absolute;left:13px;color:var(--dim);pointer-events:none}
.inp{width:100%;height:46px;padding:0 14px 0 42px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--bg2);transition:border-color .15s,box-shadow .15s}
.inp.np{padding-left:14px}
textarea.inp{height:auto;min-height:84px;padding:10px 14px;resize:vertical;line-height:1.4}
.inp.sm{height:40px}
.inp[readonly]{color:var(--muted);background:var(--card)}
.inp::placeholder{color:var(--dim)}
.inp:hover{border-color:#41525e}
.inp:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--tealbg)}
.inp.bad{border-color:var(--red);box-shadow:0 0 0 3px var(--redbg)}
.eye{position:absolute;right:6px;width:36px;height:36px;border:0;background:none;color:var(--dim);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center}
.eye:hover{color:var(--teal2)}
.check{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;cursor:pointer;user-select:none;margin:4px 0 20px}
.check input{appearance:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);background:var(--bg2);display:grid;place-content:center;cursor:pointer;margin:0;flex:none}
.check input:checked{background:var(--teal);border-color:var(--teal)}
.check input:checked::after{content:"";width:10px;height:6px;border:2.5px solid #04201d;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

/* ---------- alerts ---------- */
.msg{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--r2);font-size:14px;margin-bottom:16px;border:1px solid}
.msg svg.i{width:18px;height:18px;margin-top:1px}
.msg.err{background:var(--redbg);border-color:rgba(244,63,94,.4);color:#fecdd3}
.msg.warn{background:var(--amberbg);border-color:rgba(245,158,11,.4);color:#fde68a}
.msg.ok{background:var(--tealbg);border-color:rgba(20,184,166,.4);color:#99f6e4}

/* ---------- login ---------- */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 16px;
  background:
    radial-gradient(900px 500px at 85% -10%,rgba(20,184,166,.16),transparent 60%),
    radial-gradient(700px 400px at -10% 110%,rgba(56,189,248,.08),transparent 60%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 72px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 72px),
    var(--bg)}
.lcard{width:100%;max-width:400px;background:linear-gradient(180deg,rgba(26,35,42,.92),rgba(20,27,32,.92));border:1px solid var(--line);border-radius:20px;padding:30px 26px 24px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--teal2),#0e7490);display:grid;place-items:center;color:#04201d;font-weight:800;letter-spacing:.5px;box-shadow:0 6px 18px rgba(20,184,166,.3)}
.brand b{display:block;font-size:18px;letter-spacing:.3px}
.brand small{color:var(--muted);font-size:13px}
.lcard h1{font-size:22px;margin:0 0 4px}
.lcard p.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
.foot{margin-top:18px;text-align:center;color:var(--dim);font-size:13px}
.demo{max-width:400px;margin:14px auto 0;padding:12px 14px;border:1px dashed var(--line2);border-radius:12px;color:var(--muted);font-size:13px}
.demo b{color:var(--text)}
.demo code{background:var(--card2);padding:1px 6px;border-radius:6px;color:var(--teal2);cursor:pointer}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:5;background:#05080a;border-bottom:1px solid #000}
.topin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.top .mark{width:36px;height:36px;border-radius:10px;font-size:13px}
.top .nm{font-weight:700;letter-spacing:.3px}
.top .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.sp{flex:1}
.who{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--teal2);border:1px solid var(--line2);flex:none}
.who .n{font-size:14px;font-weight:600;line-height:1.1}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-Admin{background:var(--tealbg);color:var(--teal2)}
.p-Accounts{background:var(--violetbg);color:var(--violet)}
.p-Yard,.p-Field{background:var(--amberbg);color:var(--amber)}
.p-Viewer{background:var(--skybg);color:var(--sky)}
.p-L1{background:var(--skybg);color:var(--sky)} .p-L2{background:var(--tealbg);color:var(--teal2)}
.p-L3{background:var(--amberbg);color:var(--amber)} .p-L4{background:var(--violetbg);color:var(--violet)}
.p-me{background:var(--tealbg);color:var(--teal2);margin-left:6px;vertical-align:1px}
.st-on{background:var(--greenbg);color:var(--green)} .st-off{background:var(--redbg);color:#fb7185}
.banner{background:linear-gradient(90deg,#0f766e,var(--teal));color:#effffd}
.banner .topin{padding:7px 16px;font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}
.main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.hello h2{margin:0;font-size:24px}
.hello p{margin:2px 0 0;color:var(--muted)}
.sec{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin:22px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .12s,border-color .15s,background .15s;min-height:118px}
.tile:hover{transform:translateY(-2px);border-color:var(--c,var(--teal));background:var(--card2)}
.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--cb,var(--tealbg));color:var(--c,var(--teal2))}
.tile .ic svg.i{width:22px;height:22px}
.tile b{font-size:16px}
.tile small{color:var(--muted);font-size:13px;margin-top:-6px}
.tile .soon{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--dim);border:1px solid var(--line2);padding:1px 6px;border-radius:999px}
.tile .soon.new{color:var(--c);border-color:var(--c)}
.t-teal{--c:var(--teal2);--cb:var(--tealbg)} .t-amber{--c:var(--amber);--cb:var(--amberbg)}
.t-violet{--c:var(--violet);--cb:var(--violetbg)} .t-sky{--c:var(--sky);--cb:var(--skybg)} .t-red{--c:#fb7185;--cb:var(--redbg)}
.t-orange{--c:var(--orange);--cb:var(--orangebg)} .t-green{--c:var(--green);--cb:var(--greenbg)}
.tile::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c,var(--teal))}
.dsec{margin-top:22px}
.dhead{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dcode{font-size:12px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:8px;background:var(--cb);color:var(--c)}
.dhead b{font-size:15px}
.dhead .lv{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line2);padding:1px 7px;border-radius:999px}
.dhead small{margin-left:auto;color:var(--dim);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 4px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--teal))}
.chip.on{border-color:var(--c,var(--teal));color:var(--text);background:var(--cb,var(--tealbg))}
.chip:focus-visible{outline:2px solid var(--teal2);outline-offset:2px}

/* ---------- users & access (HR) ---------- */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1;min-width:180px}
.bar .inp.sm{padding-left:40px}
.cnt{color:var(--muted);font-size:13px;margin:10px 0 12px}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.ucard.off{border-style:dashed;background:var(--bg2)}
.ucard.off .uh .n{color:var(--muted)}
.uh{display:flex;align-items:center;gap:10px}
.uh .n{font-weight:700}
.uh small{display:block;color:var(--muted);font-size:13px;word-break:break-all}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.db{font-size:11px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:7px;background:var(--cb,var(--card2));color:var(--c,var(--muted))}
.db em{font-style:normal;font-weight:600;opacity:.85;margin-left:5px;letter-spacing:.2px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;color:var(--muted)}
.meta b{color:var(--text);font-weight:600}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:7px;box-shadow:0 0 0 3px var(--greenbg);vertical-align:1px}
.acts{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.empty{color:var(--muted);padding:30px 16px;text-align:center;border:1px dashed var(--line2);border-radius:var(--r);grid-column:1/-1}

/* ---------- dialog (bottom sheet on phones) ---------- */
.dlgw{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.dlg{width:100%;max-width:580px;max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:18px 18px 0 0;padding:20px 18px 18px;box-shadow:var(--shadow)}
.dlg h3{margin:0 0 4px;font-size:19px}
.dlg p.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.dfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:2px 0 6px}
.drow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.drow .dn{flex:1;min-width:130px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{height:34px;padding:0 11px;border:0;background:var(--bg2);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;border-left:1px solid var(--line2)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--cb,var(--tealbg));color:var(--c,var(--teal2))}
.seg button[data-v="0"].on{background:var(--card2);color:var(--text)}
.note{font-size:13px;color:var(--muted);margin-top:12px;display:flex;gap:8px;align-items:flex-start}
.note svg.i{width:16px;height:16px;margin-top:2px}
.pwbox{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:24px;letter-spacing:2px;padding:14px;border-radius:12px;background:var(--bg2);border:1px dashed var(--teal);text-align:center;color:var(--teal2);user-select:all;word-break:break-all;margin:4px 0 12px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--card2);border:1px solid var(--line2);color:var(--text);padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);transition:.2s;z-index:40;font-size:14px;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- QHSE › document register ---------- */
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:9px;position:relative}
.dcard::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c,var(--teal))}
.dcard.wd{border-style:dashed;background:var(--bg2)} .dcard.wd .dt{color:var(--muted);text-decoration:line-through}
.dc{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700;font-size:14px;color:var(--c,var(--teal2));letter-spacing:.4px}
.dt{font-weight:700;font-size:15px}
.dtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtop .sp{flex:1}
.st-Active{background:var(--greenbg);color:var(--green)} .st-Draft{background:var(--amberbg);color:var(--amber)} .st-Withdrawn{background:var(--redbg);color:#fb7185}
.ty{background:var(--card2);color:var(--muted)}
.fpv{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;color:var(--muted);background:var(--bg2);border:1px dashed var(--line2);border-radius:8px;padding:6px 8px;word-break:break-word}
.fpv b{color:var(--text);font-weight:600}
.hist{list-style:none;margin:0;padding:0;border-left:2px solid var(--line2)}
.hist li{position:relative;padding:0 0 14px 16px;font-size:14px}
.hist li::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--green)}
.hist li small{display:block;color:var(--muted);font-size:12.5px}
.ro{font-size:13px;color:var(--muted);margin:-4px 0 12px;display:flex;gap:8px;align-items:center}
.ro svg.i{width:16px;height:16px}
.segw{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:560px){.dlist{grid-template-columns:1fr}}

/* ---------- SC › quotes (W3) ---------- */
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.qcard{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;color:var(--text)}
.qcard::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--teal2)}
.qcard:hover{border-color:var(--teal);background:var(--card2)}
.qcard:focus-visible{outline:2px solid var(--teal2);outline-offset:2px}
.qno{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700;font-size:14px;color:var(--teal2);letter-spacing:.3px}
.qc{font-weight:700;font-size:15px}
.qp{color:var(--muted);font-size:13px;margin-top:-6px}
.qamt{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.qrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qrow .sp{flex:1}
.qs-Draft{background:var(--amberbg);color:var(--amber)} .qs-Sent{background:var(--skybg);color:var(--sky)} .qs-Accepted{background:var(--greenbg);color:var(--green)}
.qs-Lost{background:var(--redbg);color:#fb7185} .qs-Expired,.qs-Cancelled{background:var(--card2);color:var(--muted)}
.cs-Active{background:var(--greenbg);color:var(--green)} .cs-Inactive{background:var(--card2);color:var(--muted)}
.ss-Planned{background:var(--skybg);color:var(--sky)} .ss-Ongoing{background:var(--greenbg);color:var(--green)} .ss-Closed,.ss-Other{background:var(--card2);color:var(--muted)}
.ltab tr.go{cursor:pointer} .ltab tr.go:hover td{background:var(--card2)} .tblw{overflow-x:auto} .ccard .qno{font-size:13px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px} @media(max-width:560px){.f2{grid-template-columns:1fr}}
.tag{font-size:12px;color:var(--muted)} .tag.fill{color:#fb7185;font-weight:700} .tag.chg{color:var(--amber);font-weight:700}
.qhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.qhead h2{margin:0;font-size:21px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.3px}
.qhead .sub{color:var(--muted);font-size:14px;margin-top:2px}
.qacts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.box h4{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
.ltab{width:100%;border-collapse:collapse;font-size:14px}
.ltab th{text-align:left;font-size:12px;color:var(--dim);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line2)}
.ltab td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}

var CT_KINDS=['PO','WO','LOI'],CT_KN={PO:'Purchase order (PO)',WO:'Work order (WO)',LOI:'Letter of intent (LOI)'};

  pm:cuS(r.pm),status:cuS(r.status)||'Awaiting order',fab:+r.fab||0,value:ctNum(r.value),adv:ctNum(r.adv),paid:ctNum(r.paid)||0,pi:ctNum(r.pi)};}

function nctFull(r){
  r=r||{};var o=nct(r),L=r.lists||{},sd=r.sd||{};
  o.site=cuS(r.site);o.pmName=cuS(r.pmName);o.notes=cuS(r.notes);o.qStatus=cuS(r.qStatus);if(isDay(r.today))CT.today=r.today;o.closed=r.closed===true;o.ev=typeof r.ev==='number'?r.ev:0;o.money=r.money===true;o.can=r.can===true;

/* yes / no question; run() returns a promise; done(result) runs after success */

  var my=openDlg('<h3 id="dlgt">'+title+'</h3><p class="sub">'+text+'</p><div id="derr"></div>'+
    '<div class="dfoot"><button type="button" class="btn btn-ghost" id="dno">Cancel</button>'+
    '<button type="button" class="btn '+(danger?'btn-danger':'btn-primary')+'" id="dyes">'+okLabel+'</button></div>');
  var yes=document.getElementById('dyes');
  document.getElementById('dno').onclick=function(){if(!DLG.busy)closeDlg();};
  yes.onclick=function(){
    if(DLG.busy)return;DLG.busy=true;busyBtn(yes,true,'Working…');dlgErr('');
    run().then(function(r){if(my!==DLG.seq)return;DLG.busy=false;closeDlg();done(r);},
      function(m){if(my!==DLG.seq)return;DLG.busy=false;if(srvGate(m))return;busyBtn(yes,false);var k0=code(m).split('|')[0];if(k0==='STALE')return staleClose(reload||usersLoad);dlgErr(errText(m));if(k0==='NOTFOUND')(reload||usersLoad)();});
  };
  setTimeout(function(){if(my===DLG.seq)yes.focus();},30);
}
/* a new password is shown once only */
function pwDlg(name,pw,note){
  openDlg('<h3 id="dlgt">New password for '+esc(name)+'</h3><p class="sub">Shown <b>once only</b>. Give it to the person yourself (in person or by phone), not by email.</p>'+
    '<div class="pwbox" id="pwv">'+esc(pw)+'</div>'+
    (note?'<div class="note">'+ic('alert')+'<div>'+note+'</div></div>':'')+
    '<div class="dfoot"><button type="button" class="btn btn-ghost" id="pwc">'+ic('copy')+' Copy</button><button type="button" class="btn btn-primary" id="pwd">Done</button></div>');
  var c=document.getElementById('pwc');
  c.onclick=function(){
    var ok=function(){c.innerHTML=ic('copy')+' Copied';toast('Password copied.');};
    var fb=function(){try{var r=document.createRange();r.selectNodeContents(document.getElementById('pwv'));var s=window.getSelection();s.removeAllRanges();s.addRange(r);if(document.execCommand('copy'))return ok();}catch(e){}toast('Select the password and copy it by hand.');};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(pw).then(ok,fb);}catch(e){}
    fb();
  };
  document.getElementById('pwd').onclick=closeDlg;
  setTimeout(function(){c.focus();},30);
}

/* ======================= D2 signatures + company stamp (own signature, or a Director for anyone; stamp: Directors) ======================= */
var SG_IMG=/^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/]+=*$/;
function sgImg(u,alt){return SG_IMG.test(String(u||''))?'<img alt="'+esc(alt||'Signature')+'" src="'+u+'">':'';}
function sgKb(n){n=+n||0;return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';}
function sgErr(m){
  var k=code(m).split('|');
  if(k[0]==='BADIMG') return {type:'Only a PNG or JPG picture can be used (no SVG, PDF or other files).',size:'The picture is over <b>1 MB</b>. Make it smaller and try again.',pixels:'The picture must be between 16 and 8000 pixels on each side.',broken:'This file is damaged or is not a real PNG / JPG.'}[k[1]]||'This picture can\'t be used.';
  if(k[0]==='NOSTAFF') return 'This login is not linked to a Staff record. Link it with <b>Edit</b> first.';
  if(k[0]==='SLOW') return 'Many uploads from this login in the last hour. Please try again later.';
  return errText(m);
}
/* kind 'sig' (staff id + name) or 'stamp'; after() runs when something was saved or removed */
function sigDlg(kind,staff,name,after){
  var isS=kind==='stamp', own=!isS&&S.user&&S.user.staff===staff, data='', armed=false;
  var my=openDlg('<h3 id="dlgt">'+(isS?'Company stamp':'Signature — '+esc(name))+'</h3><p class="sub" id="sgs">'+(isS?'Directors only · printed on every outgoing PDF.':own?'Your own signature · printed on the PDFs you prepare.':'For '+esc(name)+' (Director right).')+'</p><div id="derr"></div>'+
    '<div class="sgbox" id="sgp"><span class="spin"></span></div><p class="sub" id="sgi">&nbsp;</p>'+
    '<label class="sgdrop">Choose a PNG or JPG · max 1 MB · a transparent or white background works best<input type="file" id="sgf" accept="image/png,image/jpeg"></label>'+
    '<p class="sub" id="sgm"></p>'+
    '<div class="dfoot">'+(isS?'':'<button type="button" class="btn btn-danger" id="sgr" hidden>Remove</button>')+'<button type="button" class="btn btn-ghost" id="sgc">Close</button><button type="button" class="btn btn-primary" id="sgo" disabled>Save</button></div>');
  var $=function(id){return document.getElementById(id);}, ok=$('sgo'), rm=$('sgr');
  var show=function(r){
    if(my!==DLG.seq)return;r=r||{};
    if(!pk)$('sgp').innerHTML=r.on&&sgImg(r.img,isS?'Company stamp':'Signature')||'<span class="muted">'+(r.on?'On file':isS?'No stamp on file — PDFs are made without it':'No signature yet — PDFs show an empty sign line')+'</span>';
    $('sgi').textContent=r.on?'On file'+(r.name?' · '+r.name:'')+' · '+sgKb(r.bytes)+(r.at?' · added '+fmtWhen(r.at):''):'';
    if(rm)rm.hidden=!r.on;
  };
  var pk=0;
  var fail=function(m){if(my!==DLG.seq)return;DLG.busy=false;busyBtn(ok,false);if(rm)busyBtn(rm,false);if(srvGate(m))return;dlgErr(sgErr(m));};
  (isS?call('officeStampGet',S.token):call('officeSigGet',S.token,staff)).then(show,function(m){fail(m);if(my===DLG.seq&&!pk)$('sgp').innerHTML='<span class="muted">—</span>';});
  $('sgc').onclick=function(){if(!DLG.busy)closeDlg();};
  $('sgf').onchange=function(){
    var f=this.files&&this.files[0],m=$('sgm'),me=++pk;data='';ok.disabled=true;dlgErr('');if(!f){m.textContent='';return;}
    if(!/^image\/(png|jpeg)$/.test(f.type)){m.textContent='';dlgErr(sgErr('BADIMG|type'));this.value='';return;}
    if(f.size>1048576){m.textContent='';dlgErr(sgErr('BADIMG|size'));this.value='';return;}
    var rd=new FileReader();
    rd.onload=function(){if(my!==DLG.seq||me!==pk)return;var u=String(rd.result||'');if(!SG_IMG.test(u.replace(/^data:image\/jpg;/,'data:image/jpeg;'))){dlgErr(sgErr('BADIMG|type'));return;}
      data=u.slice(u.indexOf(',')+1);$('sgp').innerHTML=sgImg(u,'New picture');m.textContent='Preview only — press Save to keep it.';ok.disabled=false;};
    rd.onerror=function(){if(my!==DLG.seq||me!==pk)return;dlgErr(sgErr('BADIMG|broken'));};
    rd.readAsDataURL(f);
  };
  ok.onclick=function(){
    if(DLG.busy||!data)return;DLG.busy=true;busyBtn(ok,true,'Saving…');dlgErr('');
    (isS?call('officeStampSave',S.token,data):call('officeSigSave',S.token,staff,data)).then(function(){if(my!==DLG.seq)return;DLG.busy=false;closeDlg();toast(isS?'Company stamp saved.':'Signature saved for '+name+'.');if(after)after();},fail);
  };
  if(rm)rm.onclick=function(){
    if(DLG.busy)return;
    if(!armed){armed=true;rm.textContent='Press again to remove';return;}
    DLG.busy=true;busyBtn(rm,true,'Removing…');dlgErr('');
    call('officeSigRemove',S.token,staff).then(function(){if(my!==DLG.seq)return;DLG.busy=false;closeDlg();toast('Signature removed — the next PDFs show an empty sign line.');if(after)after();},fail);
  };
  setTimeout(function(){if(my===DLG.seq)$('sgc').focus();},30);
}

/* ======================= screen: HR › Users & access (Directors) ======================= */
var US={rows:[],me:'',q:'',f:'all',seq:0,staff:null};
function nrow(r){
  r=r||{};
  var a=cleanAccess(r.depts)||{}, n=+r.sessions;
  return {name:String(r.name||'—'),email:String(r.email||''),depts:a,enabled:r.status==='Enabled',
    last:(typeof r.last==='number'&&isFinite(r.last))?r.last:null,sessions:(n>0&&isFinite(n))?Math.floor(n):0,staff:String(r.staff||''),sig:r.sig===true};
}
function viewUsers(){
  document.title='Core Access · Users & access';
  US.q='';US.f='all';US.rows=[];US.me='';US.loaded=false;
  var F=[['all','All'],['on','Enabled'],['off','Blocked'],['live','Signed in now']];
  var body='<div class="bar"><button type="button" class="btn btn-ghost btn-sm" id="back">'+ic('back')+' Home</button>'+
    '<div class="inwrap grow">'+ic('search')+'<input class="inp sm" id="uq" type="search" placeholder="Search name or email" autocomplete="off" aria-label="Search logins"></div>'+
    '<button type="button" class="btn btn-primary btn-sm" id="uadd">'+ic('plus')+' Add login</button></div>'+
    '<div class="chips t-red" id="uf" role="group" aria-label="Show">'+F.map(function(x){return '<button type="button" class="chip'+(x[0]==='all'?' on':'')+'" data-f="'+x[0]+'" aria-pressed="'+(x[0]==='all')+'">'+x[1]+'</button>';}).join('')+'</div>'+
    '<div id="ustamp"></div><p class="cnt" id="ucnt">&nbsp;</p><div id="ulist" class="ulist"><div class="empty">Loading logins…</div></div>';

  document.getElementById('uadd').onclick=function(){editDlg(null);};
  document.getElementById('uq').oninput=function(){US.q=this.value.trim().toLowerCase();usersDraw();};
  [].forEach.call(document.querySelectorAll('#uf .chip'),function(c){c.onclick=function(){
    US.f=c.getAttribute('data-f');
    [].forEach.call(document.querySelectorAll('#uf .chip'),function(x){var on=x===c;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});
    usersDraw();
  };});
  document.getElementById('ulist').onclick=function(e){
    var b=e.target.closest?e.target.closest('[data-a]'):null;if(!b||b.disabled)return;
    var card=b.closest('.ucard'),em=card&&card.getAttribute('data-e'),r=null;
    US.rows.forEach(function(x){if(x.email===em)r=x;});

function usersLoad(){
  var my=++US.seq;
  call('officeUsersList',S.token).then(function(r){
    if(my!==US.seq||!document.getElementById('ulist'))return;
    US.loaded=true;US.me=String(r&&r.me||'');US.rows=(r&&Array.isArray(r.rows)?r.rows:[]).map(nrow);
    US.rows.sort(function(x,y){return (y.enabled-x.enabled)||x.name.localeCompare(y.name);});
    usersDraw();
  },function(m){
    if(my!==US.seq||!document.getElementById('ulist'))return;
    if(srvGate(m))return;
    document.getElementById('ulist').innerHTML='<div class="empty">Could not load the logins: '+esc(code(m))+' <button type="button" class="btn btn-ghost btn-sm" id="uretry">Try again</button></div>';
    document.getElementById('uretry').onclick=usersLoad;
  });
}
function accBadges(a){
  if(isDirector(a)) return '<span class="db t-violet">ALL<em>Director</em></span>';
  var h=DEPTS.filter(function(D){return a[D.d];}).map(function(D){return '<span class="db '+D.c+'" title="'+esc(D.n)+'">'+D.d+'<em>'+LVL[Math.min(a[D.d],3)]+'</em></span>';}).join('');
  return h||'<span class="db">No access</span>';
}
function usersDraw(){
  var L=document.getElementById('ulist');if(!L||!US.loaded)return;
  var rows=US.rows, on=0, live=0;
  rows.forEach(function(r){if(r.enabled)on++;if(r.sessions)live++;});
  document.getElementById('ucnt').textContent=rows.length+' login'+(rows.length===1?'':'s')+' · '+on+' enabled · '+(rows.length-on)+' blocked · '+live+' signed in now';
  var show=rows.filter(function(r){
    if(US.f==='on'&&!r.enabled||US.f==='off'&&r.enabled||US.f==='live'&&!r.sessions)return false;
    return !US.q||r.name.toLowerCase().indexOf(US.q)>=0||r.email.toLowerCase().indexOf(US.q)>=0;
  });
  if(!show.length){L.innerHTML='<div class="empty">'+(rows.length?'No logins match.':'No logins yet. Use <b>Add login</b>.')+'</div>';return;}
  L.innerHTML=show.map(function(r){
    var me=r.email===US.me, a=r.depts, other=me?r.sessions-1:r.sessions;
    var B=function(act,label,icon,cls,off){return '<button type="button" class="btn btn-sm '+(cls||'btn-ghost')+'" data-a="'+act+'"'+(off?' disabled':'')+'>'+ic(icon)+label+'</button>';};
    return '<article class="ucard'+(r.enabled?'':' off')+'" data-e="'+esc(r.email)+'">'+
      '<div class="uh"><div class="av">'+esc(initials(r.name))+'</div><div style="flex:1;min-width:0"><div class="n">'+esc(r.name)+(me?'<span class="pill p-me">You</span>':'')+'</div><small>'+esc(r.email)+'</small></div>'+
        '<span class="pill '+(r.enabled?'st-on':'st-off')+'">'+(r.enabled?'Enabled':'Blocked')+'</span></div>'+
      '<div class="badges">'+accBadges(a)+'</div>'+
      '<div class="meta"><span>Last sign-in</span><b>'+esc(fmtWhen(r.last))+'</b>'+
        '<span>Signed in now</span><b>'+(r.sessions?'<i class="live"></i>Yes · '+r.sessions+' device'+(r.sessions===1?'':'s')+(me?' (incl. this one)':''):'No')+'</b>'+
        '<span>Prices &amp; amounts</span><b>'+(seesMoney(a)?'Sees them':'Hidden')+'</b>'+
        '<span>Staff record</span><b>'+(r.staff?esc(r.staff):'—')+'</b>'+
        '<span>Signature</span><b>'+(r.staff?(r.sig?'On file':'None'):'— (no Staff record)')+'</b></div>'+
      '<div class="acts">'+
        B('edit','Edit','edit')+B('reset','Reset password','key')+(r.staff?B('sig','Signature','edit'):'')+
        (me?'':(r.enabled?B('block','Block','ban','btn-danger'):B('unblock','Unblock','unlock')))+
        B('out',me?'Sign out my other devices':'Sign out everywhere','logout','',other<1)+
      '</div></article>';
  }).join('');
}
function userAct(a,r){
  var n=esc(r.name), done=function(msg){return function(res){toast(msg(res||{}));usersLoad();};};
  var ended=function(x){x=+x.ended||0;return x?' Signed out on '+x+' device'+(x===1?'':'s')+'.':'';};
  if(a==='edit') return editDlg(r);
  if(a==='sig') return sigDlg('sig',r.staff,r.name,usersLoad);
  if(a==='reset') return askDlg('Reset password for '+n+'?','A new password is made and shown to you once. The old one stops working at once and all of '+n+'\'s sign-ins end'+(r.email===US.me?' (except this one)':'')+'.','Make new password',false,
    function(){return call('officeUserReset',S.token,r.email);},
    function(res){usersLoad();pwDlg(r.name,String(res&&res.password||''),'Old sign-ins ended: '+(+res.ended||0)+'.');});
  if(a==='block') return askDlg('Block '+n+'?',n+' is signed out on all devices at once and can\'t sign in until a Director unblocks the login. Nothing they entered is deleted.','Block',true,
    function(){return call('officeUserBlock',S.token,r.email,true);},done(function(x){return r.name+' is blocked.'+ended(x);}));
  if(a==='unblock') return askDlg('Unblock '+n+'?',n+' can sign in again with the same password, with the same access as before.','Unblock',false,
    function(){return call('officeUserBlock',S.token,r.email,false);},done(function(){return r.name+' can sign in again.';}));
  if(a==='out') return askDlg(r.email===US.me?'Sign out your other devices?':'Sign out '+n+' everywhere?',r.email===US.me?'Every other phone or PC signed in as you is signed out. This one stays signed in.':n+' is signed out on every phone and PC. The login stays enabled and the password stays the same.','Sign out',true,
    function(){return call('officeUserSignOutAll',S.token,r.email);},done(function(x){return 'Signed out on '+(+x.ended||0)+' device'+(+x.ended===1?'':'s')+'.';}));
}
/* add (r = null) or edit a login: name (pick a Staff row or type), email, Director or level per department */

  if(r&&!dir) DEPTS.forEach(function(D){if(r.depts[D.d])a[D.d]=Math.min(r.depts[D.d],3);});
  var me=r&&r.email===US.me;
  var rowsH=function(){return DEPTS.map(function(D){var v=a[D.d]||0;
    return '<div class="drow '+D.c+'" data-d="'+D.d+'"><span class="dcode">'+D.d+'</span><span class="dn">'+esc(D.n)+'</span>'+
      '<span class="seg" role="radiogroup" aria-label="'+esc(D.n)+' level">'+[0,1,2,3].map(function(l){
        return '<button type="button" role="radio" aria-checked="'+(v===l)+'" data-v="'+l+'"'+(v===l?' class="on"':'')+'>'+(l?LVL[l]:'None')+'</button>';}).join('')+'</span></div>';}).join('');};
  var my=openDlg('<h3 id="dlgt">'+(isNew?'Add login':'Edit login')+'</h3>'+
    '<p class="sub">'+(isNew?'A password is made for the new login and shown to you once.':'Changing the access signs this person out everywhere; they sign in again with the new access.')+'</p>'+
    '<div id="derr"></div>'+
    (me?'<div class="msg warn">'+ic('alert')+'<div>This is <b>your own</b> login. You can change the name; another Director must change your access.</div></div>':'')+
    '<label class="fld"><span>Name</span><input class="inp np" id="fn" maxlength="80" autocomplete="off" placeholder="Full name" value="'+esc(r?r.name:'')+'"></label>'+
    '<label class="fld"><span>Staff record (signature, Prepared by)</span><select class="inp np" id="fsf" disabled><option value="">Loading the Staff list…</option></select><small id="fst">'+(r&&r.staff?'Staff record '+esc(r.staff):'Not linked to a Staff record')+'</small></label>'+
    '<label class="fld"><span>Email (this is the sign-in name)</span><input class="inp np" id="fe" type="email" inputmode="email" maxlength="120" autocomplete="off" placeholder="name@example.com" value="'+esc(r?r.email:'')+'"'+(isNew?'':' readonly')+'>'+(isNew?'<small>Any email works, personal ones too.</small>':'<small>The email can\'t be changed. Add a new login and block this one instead.</small>')+'</label>'+
    '<span class="lbl">Access</span>'+
    '<label class="check" style="margin:0 0 6px"><input type="checkbox" id="fdir"'+(dir?' checked':'')+(me?' disabled':'')+'> <span><b style="color:var(--text)">Director</b> — all departments, all actions, admin (L4)</span></label>'+
    '<div id="fdr"'+(dir?' hidden':'')+'>'+rowsH()+'</div>'+
    '<div class="note" id="fmo"></div>'+
    '<div class="dfoot"><button type="button" class="btn btn-ghost" id="fcan">Cancel</button><button type="button" class="btn btn-primary" id="fsave">'+(isNew?'Add login':'Save')+'</button></div>');
  var fn=document.getElementById('fn'),fe=document.getElementById('fe'),fdir=document.getElementById('fdir'),fdr=document.getElementById('fdr'),save=document.getElementById('fsave');
  var staffId=r?r.staff:'';

  var segs=function(){if(me)[].forEach.call(fdr.querySelectorAll('button'),function(b){b.disabled=true;});};
  money();segs();
  fdir.onchange=function(){dir=fdir.checked;if(dir){keepA=a;}else{a=keepA||{};fdr.innerHTML=rowsH();segs();}fdr.hidden=dir;money();};
  fdr.onclick=function(e){var b=e.target.closest?e.target.closest('button[data-v]'):null;if(!b||b.disabled)return;
    var d=b.closest('.drow').getAttribute('data-d'),v=+b.getAttribute('data-v');if(v)a[d]=v;else delete a[d];
    [].forEach.call(b.parentNode.children,function(x){var on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-checked',on);});money();};
  /* staff list for the name box (pick a Staff row = linked) */
  var fsf=document.getElementById('fsf'),fst=document.getElementById('fst'),staffTouched=false;
  var stLine=function(note){fst.textContent=(staffId?'Staff record '+staffId:'Not linked to a Staff record')+(note?' — '+note:'');};
  var byName=function(v){v=String(v||'').trim().toLowerCase();var hit=null,n=0;(US.staff||[]).forEach(function(s){if(s.name.toLowerCase()===v){hit=s;n++;}});return n===1?hit:null;};
  var fillStaff=function(list){if(!document.body.contains(fsf))return;

  fsf.onchange=function(){staffTouched=true;staffId=fsf.value;var s=null;(US.staff||[]).forEach(function(x){if(x.id===staffId)s=x;});
    if(s&&!fn.value.trim())fn.value=s.name;stLine('');};

function tk(n){n=+n;if(!isFinite(n))return '—';var neg=n<0;n=Math.abs(n);var s=n.toFixed(2).split('.'),i=s[0],last=i.slice(-3),rest=i.slice(0,-3);
  if(rest)last=','+last;return (neg?'−':'')+rest.replace(/\B(?=(\d{2})+(?!\d))/g,',')+last+'.'+s[1];}

function viewQuotes(){

function quotesLoad(){
  var my=++QS.seq;
  call('officeQuoteList',S.token).then(function(r){
    if(my!==QS.seq||!document.getElementById('qlist'))return;
    QS.loaded=true;QS.can=!!(r&&r.can===true);QS.money=!!(r&&r.money===true);
    QS.rows=(r&&Array.isArray(r.rows)?r.rows:[]).map(nquote).filter(function(x){return x.no;});
    /* newest first: date, then number */
    QS.rows.sort(function(a,b){return (b.date>a.date?1:b.date<a.date?-1:0)||b.no.localeCompare(a.no);});
    var nb=document.getElementById('qnew');
    if(nb){nb.innerHTML=QS.can?'<button type="button" class="btn btn-primary btn-sm" id="qadd">'+ic('plus')+' New quote</button>':'';
      if(QS.can)document.getElementById('qadd').onclick=function(){viewQuoteEdit();};}
    quotesDraw();
  },function(m){
    if(my!==QS.seq||!document.getElementById('qlist'))return;
    if(srvGate(m))return;
    document.getElementById('qlist').innerHTML='<div class="empty">Could not load the quotes: '+esc(code(m))+' <button type="button" class="btn btn-ghost btn-sm" id="qretry">Try again</button></div>';
    document.getElementById('qretry').onclick=quotesLoad;
  });
}
function quotesDraw(){

  var show=rows.filter(function(r){
    if(QS.st&&r.status!==QS.st||QS.ty&&r.type!==QS.ty)return false;
    return !QS.q||(r.no+' '+r.cust+' '+r.project).toLowerCase().indexOf(QS.q)>=0;

  L.innerHTML=P+show.map(function(r){

      '<div class="qrow"><span class="qno">'+esc(r.no)+(r.rev?' · Rev '+r.rev:'')+'</span><span class="sp"></span>'+(r.type?'<span class="pill ty">'+esc(r.type)+'</span>':'')+'<span class="pill qs-'+r.status+'">'+r.status+'</span></div>'+
      '<div class="qc">'+esc(r.cust)+'</div>'+(r.project?'<div class="qp">'+esc(r.project)+'</div>':'')+
      '<div class="qrow">'+(QS.money&&r.total!==null?'<span class="qamt">Tk '+tk(r.total)+'</span>':'')+'<span class="sp"></span><span class="tag">'+esc(fmtDay(r.date))+'</span></div>'+
      '<div class="qrow">'+(r.job?'<span class="tag">Job <b style="color:var(--text)">'+esc(r.job)+'</b></span>':r.valid&&(r.status==='Draft'||r.status==='Sent')?'<span class="tag">Valid until '+esc(fmtDay(r.valid))+'</span>':'')+
        '<span class="sp"></span>'+(r.fill?'<span class="tag fill">'+r.fill+' to fill</span>':'')+(r.changed?'<span class="tag chg">'+r.changed+' term'+(r.changed===1?'':'s')+' changed</span>':'')+'</div>'+

/* ---------- one quote ---------- */
function nqfull(r){
  r=r||{};var b=nquote(r),num0=function(v){v=+v;return isFinite(v)?v:0;},has=function(v){return typeof v==='number'&&isFinite(v);};
  b.contact=String(r.contact||'');b.phone=String(r.phone||'');b.email=String(r.email||'');b.site=String(r.site||'');b.subject=String(r.subject||'');
  b.preparedBy=String(r.preparedBy||'');b.pdf=typeof r.pdf==='string'?r.pdf:'';b.myEmail=String(r.myEmail||'');
  b.tv=+r.tv||0;b.money=r.money===true;b.can=r.can===true;b.locked=r.locked==='JOB'||r.locked==='STATUS'?r.locked:'';
  b.lines=(Array.isArray(r.lines)?r.lines:[]).map(function(l,i){l=l||{};return {n:+l.n||i+1,desc:String(l.desc||''),size:String(l.size||''),unit:String(l.unit||''),qty:num0(l.qty),
    months:(l.months===''||l.months==null)?'':num0(l.months),billing:String(l.billing||''),rate:has(l.rate)?l.rate:null,amount:has(l.amount)?l.amount:null,optional:l.optional===true,selected:l.selected!==false};});
  var t=r.tot&&typeof r.tot==='object'?r.tot:null;
  b.tot=t?{sub:num0(t.sub),vatPct:num0(t.vatPct),vat:num0(t.vat),atPct:num0(t.atPct),at:num0(t.at),aitPct:num0(t.aitPct),ait:num0(t.ait),total:num0(t.total),advPct:num0(t.advPct),advance:num0(t.advance),words:String(t.words||'')}:null;
  if(!b.tot)b.money=false;
  b.terms=nterms(r.terms);b.fill=(+r.fill>0)?Math.floor(+r.fill):0;b.changed=(+r.changed>0)?Math.floor(+r.changed):0;return b;
}
function nterms(T){
  T=T||{};var V=(Array.isArray(T.vars)?T.vars:[]).map(function(v){v=v||{};var kind=v.kind==='pick'||v.kind==='fixed'?v.kind:'num',ok=function(x){return kind==='num'?typeof x==='number'&&isFinite(x):typeof x==='string';};
    return {k:String(v.k||''),label:String(v.label||v.k||''),unit:String(v.unit||''),kind:kind,opts:kind==='pick'&&Array.isArray(v.opts)?v.opts.map(String):[],
      std:ok(v.std)?v.std:'',from:v.from==='Customer'?'Customer':'Company settings',value:kind!=='fixed'&&ok(v.value)?v.value:null,tok:typeof v.tok==='string'?v.tok:null,
      min:+v.min||0,max:isFinite(+v.max)&&v.max!==''&&v.max!=null?+v.max:1e9};}).filter(function(v){return /^[A-Za-z]\w{0,30}$/.test(v.k);});
  var ST=['std','changed','removed','added'];
  return {set:String(T.set||''),vars:V,secs:(Array.isArray(T.secs)?T.secs:[]).map(function(s){s=s||{};return {t:String(s.t||''),no:String(s.no||''),cl:(Array.isArray(s.cl)?s.cl:[]).map(function(c){c=c||{};
    return {id:String(c.id||''),no:String(c.no||''),title:String(c.title||''),text:String(c.text||''),std:String(c.std||''),st:ST.indexOf(c.st)>=0?c.st:'std'};}).filter(function(c){return c.id;})};})};
}
function vsrc(v){return v.value!==null?'quote':v.from==='Customer'?'cust':'std';}
function vshow(v){var x=v.value!==null?v.value:v.std;return (v.kind==='num'?num(x):String(x))+(v.unit?' '+v.unit:'');}
/* [text] still to fill: matches in order, notes excluded */
function fills(s){var re=/\[([^\]"]*)\]/g,m,o=[];while((m=re.exec(s)))if(NOFILL.indexOf(m[1])<0)o.push({at:m.index,len:m[0].length,what:m[1]});return o;}
/* clause text → safe HTML: {Key} = variable chip (shows the printed text), [text] = to fill (red) */
function clauseHtml(c,vars,edit){
  var out='',re=/\{([A-Za-z]\w{0,30})\}|\[([^\]"]*)\]/g,last=0,m,fi=0,s=c.text,live=edit&&c.st!=='removed';
  while((m=re.exec(s))){
    out+=esc(s.slice(last,m.index));last=re.lastIndex;
    if(m[1]){var v=null;vars.forEach(function(x){if(x.k===m[1])v=x;});
      if(!v){out+=esc(m[0]);continue;}
      var val=v.value!==null?v.value:v.std,lab=v.tok!==null?v.tok:v.kind==='num'?num(val):String(val);
      out+=live&&v.kind!=='fixed'?'<button type="button" class="tv v-'+vsrc(v)+'" data-var="'+esc(v.k)+'" title="'+esc(v.label)+' — click to change">'+esc(lab)+'</button>':'<span class="tv v-'+(v.kind==='fixed'?'std':vsrc(v))+'" title="'+esc(v.label)+'">'+esc(lab)+'</span>';
    } else if(NOFILL.indexOf(m[2])>=0){out+=esc(m[0]);}
    else {
      out+=live?'<button type="button" class="tv v-fill" data-fill="'+fi+'" title="Fill in for this quote">['+esc(m[2])+']</button>':'<span class="tv v-fill">['+esc(m[2])+']</span>';
      fi++;
    }
  }
  return out+esc(s.slice(last));
}
function viewQuote(no,pre){
  document.title='Core Access · '+no;
  QS.cur=null;QS.only=false;QS.vno=String(no);
  shell('Sales · Quote','<div class="bar"><button type="button" class="btn btn-ghost btn-sm" id="qback">'+ic('back')+' Quotes</button></div><div id="qv"><div class="empty">Loading '+esc(no)+'…</div></div>');
  document.getElementById('qback').onclick=function(){viewQuotes();};
  quoteLoad(no,pre);
}
function quoteLoad(no,pre){
  var my=++QS.seq;
  if(pre&&typeof pre==='object'&&String(pre.no||'')===String(no)){QS.cur=nqfull(pre);quoteDraw();return;} /* W4c: the view came with the save */
  call('officeQuoteGet',S.token,no).then(function(r){
    if(my!==QS.seq||!document.getElementById('qv'))return;
    QS.cur=nqfull(r);if(!QS.cur.no)QS.cur.no=no;quoteDraw();
  },function(m){
    if(my!==QS.seq||!document.getElementById('qv'))return;
    if(srvGate(m))return;
    if(code(m).split('|')[0]==='NOTFOUND'){viewQuotes();toast(no+' no longer exists.');return;}
    document.getElementById('qv').innerHTML='<div class="empty">Could not load '+esc(no)+': '+esc(code(m))+' <button type="button" class="btn btn-ghost btn-sm" id="qretry">Try again</button></div>';
    document.getElementById('qretry').onclick=function(){quoteLoad(no);};

}

      else if(rest&&!(qt>0&&qt<=1e7))bad.push('line '+(n+1)+': qty “'+rest+'”');
      else ok.push([x,rest?qt:'']);});return {ok:ok,bad:bad};};
  var show=function(){var r=parse();document.getElementById('pp').innerHTML=(r.ok.length?'<b>'+r.ok.length+'</b> row'+(r.ok.length===1?'':'s')+' ready':'')+(r.bad.length?(r.ok.length?' · ':'')+'<span style="color:#fb7185">'+r.bad.length+' not understood: '+esc(r.bad.slice(0,4).join('; '))+(r.bad.length>4?' …':'')+'</span>':'');};
  document.getElementById('pt').oninput=show;
  document.getElementById('dno').onclick=closeDlg;
  document.getElementById('dyes').onclick=function(){var r=parse();if(!r.ok.length){dlgErr('No rows understood yet.');return;}
    if(r.bad.length){dlgErr('Fix or remove the lines not understood first ('+r.bad.length+').');return;}
    var mo=q.type==='Rental'?' / month':'',at=q.lines.length;while(at>0&&!qeUsed(q.lines[at-1]))at--;
    if(at+r.ok.length>200){dlgErr('A quote can have up to 200 lines.');return;}
    var add=r.ok.map(function(p){var x=p[0];return qeLine({code:x.code,desc:x.name,size:x.size,qty:p[1],unit:x.unit+mo,rate:q.type==='Rental'?x.hire:x.sale});});
    q.lines.splice.apply(q.lines,[at,q.lines.length-at].concat(add));QE.dirty=true;closeDlg();qeRedrawRows();toast(add.length+' rows added.');};
  setTimeout(function(){if(my===DLG.seq)document.getElementById('pt').focus();},30);
}
function qeSums(){
  var q=QE.q,M=QE.d.money===true,t=qeTot(),n=q.lines.filter(function(l){return l.desc||l.code;}).length,s=QE.d.set;
  var sm=document.getElementById('qesum');
  if(sm)sm.innerHTML=n+' line'+(n===1?'':'s')+(M?' · Total <b>Tk '+tk(t.total)+'</b>':'');
  var T=document.getElementById('qetot');if(!T)return;
  T.innerHTML='<span>Subtotal</span><b>Tk '+tk(t.sub)+'</b><span>VAT '+esc(num(s.vat))+' %</span><b>Tk '+tk(t.vat)+'</b>'+(s.at?'<span>AT '+esc(num(s.at))+' %</span><b>Tk '+tk(t.at)+'</b>':'')+(s.ait?'<span>AIT '+esc(num(s.ait))+' %</span><b>Tk '+tk(t.ait)+'</b>':'')+
    '<span class="gt">Total</span><b class="gt">Tk '+tk(t.total)+'</b><span>Advance '+esc(num(qeNum(q.adv)||0))+' %</span><b>Tk '+tk(t.advance)+'</b>';
  document.getElementById('qewords').textContent=t.total>0?qeWords(t.total):'';
}
/* ---------- save ---------- */
function qeCheck(){
  var q=QE.q,M=QE.d.money===true,e=[],units=QE.d.units;
  if(!q.cust)e.push('pick the <b>customer</b>');
  if(!q.site)e.push('pick the <b>project</b>');
  if(!isDay(q.date))e.push('the <b>date</b>');
  if(!isDay(q.valid)||!isDay(q.date)||qeDays(q.date,q.valid)<1||qeDays(q.date,q.valid)>365)e.push('<b>valid until</b> (1 to 365 days after the date)');
  var a=qeNum(q.adv);if(a===null||isNaN(a)||a<0||a>100||!qeDp(a,2))e.push('<b>advance %</b> (0–100)');
  var used=q.lines.filter(qeUsed);
  if(!used.length)e.push('at least one <b>line</b>');
  if(used.length>200)e.push('up to 200 <b>lines</b>');
  q.lines.forEach(function(l,i){if(!qeUsed(l))return;var n='line '+(i+1)+': ',qt=qeNum(l.qty),r=qeNum(l.rate),u=qeBaseUnit(l.unit);
    if(!l.desc.trim())e.push(n+'description');
    if(qt===null||isNaN(qt)||qt<=0||qt>1e7||!qeDp(qt,3))e.push(n+'qty above 0');
    else if(M&&r!==null&&!isNaN(r)&&qt*r>1e12)e.push(n+'amount too large');
    if(!u)e.push(n+'unit');else if(units.length&&units.indexOf(u)<0)e.push(n+'unit (pick one from the list)');
    else if((q.type==='Sale'||q.svc)&&qeMonthly(l.unit))e.push(n+(q.svc?'a Service quote has no “/ month” unit':'a sale has no “/ month” unit'));
    if(M&&(r===null||isNaN(r)||r<0||r>1e9||!qeDp(r,2)))e.push(n+'rate');});
  return {e:e,lines:used};
}
/* W4g: Save shows "Saved" at once; the call runs in the background (one per form in flight; another Save meanwhile = one more run
   with the newest data, sent when the first answers, with its number + version). The data stays here until the server answers:
   a refusal shows the error on the form (the form opens again with the data if it was left). Sign-out drops the answers (QB.ep). */
function qeSave(pdf){
  var q=QE.q,c=qeCheck(),box=document.getElementById('qeerr'),J=QE.job;
  if(!QE.dirty&&J&&J.busy){if(pdf)J.pdf=true;box.innerHTML=qeSavedMsg(J.pdf);return;}
  if(q.no&&!QE.dirty){viewQuote(q.no);toast(pdf?'Nothing changed — use Open / Make PDF here.':'Nothing changed.');return;}
  if(c.e.length){box.innerHTML='<div class="msg warn">'+ic('alert')+'<div>Please check: '+c.e.slice(0,6).join(' · ')+(c.e.length>6?' · …':'')+'</div></div>';return;}
  box.innerHTML='';
  var b1=document.getElementById('qesave');if(b1&&b1.disabled)return;
  var d={no:q.no,ev:q.ev,type:q.type,cust:q.cust,site:q.site,attention:q.attention.trim(),subject:q.subject.trim()||qeSubj(),date:q.date,valid:q.valid,prep:q.prep,adv:qeNum(q.adv),pdf:false,
    lines:c.lines.map(function(l){var o={code:l.code,desc:l.desc.trim(),qty:l.basis==='lump'?1:qeNum(l.qty),unit:l.unit.trim(),opt:l.opt===true,chosen:l.chosen===true,basis:l.basis,dim:l.dim||null};o.rate=qeNum(l.rate)||0;return o;})};
  var cu=qeCust(),si=qeSite(),s={d:d,q:JSON.parse(JSON.stringify(q)),qd:QE.d,cust:cu?cu.name:'',project:si?si.project:'',type:q.type};
  if(!J)J=QE.job={id:++QB.n,busy:false,next:null,pdf:false,no:q.no||'',ev:q.ev};
  if(pdf)J.pdf=true;
  QE.dirty=false;box.innerHTML=qeSavedMsg(J.pdf);
  if(J.busy){J.next=s;return;}
  qeSend(J,s);
}
function qeSavedMsg(pdf){return '<div class="msg ok" role="status">'+ic('okc')+'<div>Saved'+(pdf?' — the PDF follows.':'.')+'</div></div>';}
function qeJobOf(no){var o=null;Object.keys(QB.jobs).forEach(function(k){if(QB.jobs[k].no===no)o=QB.jobs[k];});return o;}
function qePendHtml(){return Object.keys(QB.lost).map(function(k){var x=QB.lost[k],s=x.s;
  return '<button type="button" class="qcard" data-lost="'+esc(k)+'"><div class="qrow"><span class="qno">'+ic('alert')+' '+esc(x.J.no||'New quote')+' — not saved</span><span class="sp"></span>'+(s.type?'<span class="pill ty">'+esc(s.type)+'</span>':'')+'</div>'+
    '<div class="qc">'+esc(s.cust)+'</div><div class="qp">Open to see why and save again</div></button>';}).join('')+Object.keys(QB.pend).map(function(k){var p=QB.pend[k];
  return '<div class="qcard" aria-busy="true"><div class="qrow"><span class="qno"><span class="spin"></span> Saving…</span><span class="sp"></span>'+(p.type?'<span class="pill ty">'+esc(p.type)+'</span>':'')+'</div>'+
    '<div class="qc">'+esc(p.cust)+'</div>'+(p.project?'<div class="qp">'+esc(p.project)+'</div>':'')+'</div>';}).join('');}
function qeSend(J,s){
  var d=s.d,ep=QB.ep,pk=J.no?'':'p'+J.id;J.busy=true;QB.jobs[J.id]=J;
  var fail=function(m){
    if(ep!==QB.ep)return;if(pk){delete QB.pend[pk];quotesDraw();}
    var u=code(m).split('|');if(u[0]==='SAVEUNSURE'&&!J.no&&u[1]){J.no=u[1];J.ev=/^\d+$/.test(u[2]||'')?+u[2]:null;if(QE.job===J&&QE.q){QE.q.no=J.no;QE.q.ev=J.ev;}} /* CR run 17 L2334: the new quote is there: Save again edits it */
    var n=J.next||s,here=QE.job===J&&!!document.getElementById('qe'),no=J.no||d.no,k=code(m).split('|')[0];J.next=null;J.busy=false;J.pdf=J.made=J.chg=false;delete QB.jobs[J.id];
    if(srvGate(m)){toast((no||'The new quote')+' was not saved — sign in and enter the changes again.');return;} /* review M3 */
    if(k==='QLOCKED'){if(here){QE.dirty=false;QE.job=null;viewQuote(no);}toast(no+' is locked now — nothing saved.');qeWake(J);return;}
    if(here){QE.dirty=true;qeErr(m,no,false);qeWake(J);return;}
    if(qeFree()){qeReopen(J,n);qeErr(m,no,true);return;}
    qePark(J,n,m);qeWake(J); /* review H1: the person is busy on another form: keep this one for them */
  };
  if(J.no&&typeof J.ev!=='number'){setTimeout(function(){fail('NOEV');},0);return;} /* CR: the last answer had no version: never send on an unconfirmed one */
  d.no=J.no||d.no;if(J.no)d.ev=J.ev;
  if(pk){QB.pend[pk]={cust:s.cust,project:s.project,type:s.type};quotesDraw();}
  call('officeQuoteSave',S.token,d).then(function(r){
    if(ep!==QB.ep)return;r=r||{};if(pk)delete QB.pend[pk];
    var no=String(r.no||d.no),here=QE.job===J&&!!document.getElementById('qe');J.no=no;J.ev=typeof r.ev==='number'?r.ev:null;
    if(here&&QE.q){QE.q.no=no;QE.q.ev=J.ev;QE.q.rev=+r.rev||0;QE.q.status=String(r.status||QE.q.status);}
    if(!d.no)J.made=true;if(r.changed!==false)J.chg=true;
    if(J.next){var n=J.next;J.next=null;qeSend(J,n);return;}
    J.busy=false;delete QB.jobs[J.id];var pdf=J.pdf,made=J.made,chg=J.chg;J.pdf=J.made=J.chg=false;
    toast((made?'Quote '+no+' saved as Draft':'Saved '+no+(r.rev?' · Rev '+r.rev:''))+(!chg?' (nothing changed)':pdf?' — making the PDF…':'.'));
    if(QS.pdfBg)delete QS.pdfBg[no];
    qeWake(J);
    if(here&&!QE.dirty&&!document.getElementById('dlg')){QE.job=null;viewQuote(no,r.view);} /* review L8: an open dialog stays */
    else if(!here){if(document.getElementById('qv')&&QS.vno===no)quoteLoad(no,r.view);else if(document.getElementById('qlist'))quotesLoad();}
    if(pdf)qPdfBg(no);
  },fail);
}
function qeWake(J){if(J.wait){var f=J.wait;J.wait=null;setTimeout(f,0);}}
/* a refused save can take over the screen only when nothing unsaved / in flight / no dialog is there */
function qeFree(){return !document.getElementById('dlg')&&!(document.getElementById('qe')&&(QE.dirty||(QE.job&&QE.job.busy)));}
function qePark(J,s,m){var k=J.no||'p'+J.id;QB.lost[k]={J:J,s:s,m:m};quotesDraw();
  var k=code(m).split('|')[0],why={SAVEUNSURE:'the save could not be confirmed',STALE:'changed by someone meanwhile',NOEV:'version not confirmed',BUSY:'the system was busy'}[k]||k.toLowerCase();
  toast((J.no||'The new quote')+' was not saved ('+why+') — your changes are kept: open it from Quotes.');}
function qeUnpark(k){var x=QB.lost[k];delete QB.lost[k];qeReopen(x.J,x.s);qeErr(x.m,x.J.no||x.s.d.no,false);}
/* the form again with the data of a refused background save (the person had left it) */
function qeReopen(J,s){
  var no=J.no||s.d.no||'';document.title='Core Access · '+(no?'Edit '+no:'New quote');qePickClose();QE.seq++;
  QE.d=s.qd;QE.q=s.q;if(J.no){QE.q.no=J.no;QE.q.ev=J.ev;}QE.dirty=true;QE.saving=false;QE.job=J;qeShell(no);qeDraw();
}
function qeErr(m,no,away){
  var k=code(m).split('|')[0];
  if(k==='QLOCKED'){QE.dirty=false;QE.job=null;viewQuote(no);toast(no+' is locked now — nothing saved.');return;}
  if(away)toast((no?no+' ':'The quote ')+'was not saved — the form is open again with your changes.');
  var box=document.getElementById('qeerr');if(!box)return;
  if(k==='STALE'||k==='NOEV'){box.innerHTML='<div class="msg warn">'+ic('alert')+'<div>'+(k==='NOEV'?esc(no)+' was saved, but your newest changes were not sent: the saved version could not be confirmed. Open the latest and enter them again.':'Someone changed '+esc(no)+' a moment ago — nothing saved.')+' <button type="button" class="btn btn-ghost btn-sm" id="qereload">Open the latest</button></div></div>';
    document.getElementById('qereload').onclick=function(){QE.dirty=false;viewQuoteEdit(no);};return;}
  box.innerHTML='<div class="msg warn">'+ic('alert')+'<div>'+errText(m)+'</div></div>';
}

/* ======================= start ======================= */
(function start(){
  var t=tokGet();
  if(!t) return viewLogin();
  call('officeMe',t).then(function(u){S.token=t;S.user=nu(u);viewHome();},function(m){
    /* only a dead session clears the saved sign-in; a network / server hiccup keeps it for the next try */
    if(code(m)==='NOSESSION'){tokClear();viewLogin();}
    else viewLogin('<div class="msg warn">'+ic('alert')+'<div>Could not check your sign-in just now. <b>Reload</b> to try again, or sign in below.</div></div>');
  });
})();
</script>
