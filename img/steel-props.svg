<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1980 1360" width="1980" height="1360" font-family="Inter, Arial, sans-serif">
<title>Steel props for hire and sale</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFB"/><stop offset="1" stop-color="#E1EAF0"/></linearGradient>
<linearGradient id="gv" x1="0" x2="1"><stop offset="0" stop-color="#8E979E"/><stop offset=".3" stop-color="#EEF1F3"/><stop offset=".55" stop-color="#C7CDD1"/><stop offset="1" stop-color="#7A838A"/></linearGradient>
<linearGradient id="ch" x1="0" x2="1"><stop offset="0" stop-color="#1A1D21"/><stop offset=".3" stop-color="#5A636B"/><stop offset=".6" stop-color="#2B3036"/><stop offset="1" stop-color="#121417"/></linearGradient>
<linearGradient id="tl" x1="0" x2="1"><stop offset="0" stop-color="#11545D"/><stop offset=".3" stop-color="#4DB6C4"/><stop offset=".6" stop-color="#1E7F8C"/><stop offset="1" stop-color="#0D474F"/></linearGradient>
<pattern id="th" width="8" height="6" patternUnits="userSpaceOnUse"><line x1="0" y1="1" x2="8" y2="1" stroke="#6E777E" stroke-width="1.2"/></pattern>
</defs>
<rect width="1980" height="1360" fill="url(#bg)"/>
<line x1="80" y1="1242" x2="1520" y2="1242" stroke="#C9D3DA" stroke-width="2"/>

<!-- 1 U-head prop: charcoal outer, galvanised inner -->
<g transform="translate(260,0)">
<ellipse cx="0" cy="1240" rx="90" ry="9" fill="#2B3036" opacity=".12"/>
<rect x="-14" y="170" width="28" height="470" fill="url(#gv)" stroke="#7F888F"/>
<g fill="#2B3036"><circle cy="220" r="5"/><circle cy="275" r="5"/><circle cy="330" r="5"/><circle cy="385" r="5"/><circle cy="440" r="5"/><circle cy="495" r="5"/></g>
<line x1="-38" y1="585" x2="34" y2="585" stroke="#3C444B" stroke-width="7" stroke-linecap="round"/>
<path d="M34 585 C78 585 78 632 30 630" stroke="#3C444B" stroke-width="5" fill="none" stroke-linecap="round"/>
<rect x="-26" y="600" width="52" height="26" rx="4" fill="url(#ch)"/>
<rect x="-20" y="626" width="40" height="596" fill="url(#ch)"/>
<rect x="-56" y="1220" width="112" height="14" rx="2" fill="url(#ch)"/>
<rect x="-10" y="150" width="20" height="24" fill="url(#gv)"/>
<path d="M-52 88 H-40 V144 H40 V88 H52 V156 H-52 Z" fill="url(#gv)" stroke="#7F888F"/>
<text y="1300" text-anchor="middle" font-size="34" font-weight="700" fill="#2B3036">U-head prop</text>
<text y="1338" text-anchor="middle" font-size="22" fill="#5F676E">For shoring beams &amp; bearers</text>
</g>

<!-- 2 Heavy-duty galvanised prop -->
<g transform="translate(620,0)">
<ellipse cx="0" cy="1240" rx="92" ry="9" fill="#2B3036" opacity=".12"/>
<rect x="-16" y="168" width="32" height="392" fill="url(#gv)" stroke="#7F888F"/>
<g fill="#2B3036"><circle cy="215" r="5"/><circle cy="275" r="5"/><circle cy="335" r="5"/><circle cy="395" r="5"/><circle cy="455" r="5"/></g>
<rect x="-24" y="548" width="48" height="92" fill="url(#gv)" stroke="#7F888F"/>
<rect x="-24" y="548" width="48" height="92" fill="url(#th)"/>
<line x1="-42" y1="520" x2="36" y2="520" stroke="#5F676E" stroke-width="7" stroke-linecap="round"/>
<path d="M36 520 C82 520 82 566 32 564" stroke="#5F676E" stroke-width="5" fill="none" stroke-linecap="round"/>
<rect x="-30" y="598" width="60" height="24" rx="4" fill="url(#gv)" stroke="#6E777E"/>
<path d="M30 610 L74 600" stroke="#8A9299" stroke-width="6" stroke-linecap="round"/><circle cx="76" cy="599" r="5" fill="#8A9299"/>
<rect x="-23" y="640" width="46" height="582" fill="url(#gv)" stroke="#7F888F"/>
<rect x="-58" y="154" width="116" height="14" rx="2" fill="url(#gv)" stroke="#7F888F"/>
<rect x="-58" y="1220" width="116" height="14" rx="2" fill="url(#gv)" stroke="#7F888F"/>
<text y="1300" text-anchor="middle" font-size="34" font-weight="700" fill="#2B3036">Heavy-duty prop</text>
<text y="1338" text-anchor="middle" font-size="22" fill="#5F676E">Galvanised · fine screw adjustment</text>
</g>

<!-- 3 Light-duty painted prop (teal, orange pin) -->
<g transform="translate(980,0)">
<ellipse cx="0" cy="1240" rx="86" ry="9" fill="#2B3036" opacity=".12"/>
<rect x="-13" y="214" width="26" height="420" fill="url(#tl)"/>
<g fill="#0D2F33"><circle cy="260" r="5"/><circle cy="315" r="5"/><circle cy="370" r="5"/><circle cy="425" r="5"/><circle cy="480" r="5"/><circle cy="535" r="5"/></g>
<line x1="-36" y1="598" x2="30" y2="598" stroke="#E8772E" stroke-width="7" stroke-linecap="round"/>
<path d="M30 598 C72 598 72 646 28 644" stroke="#E8772E" stroke-width="5" fill="none" stroke-linecap="round"/>
<rect x="-22" y="610" width="44" height="22" rx="3" fill="url(#tl)"/>
<rect x="-19" y="630" width="38" height="592" fill="url(#tl)"/>
<rect x="-52" y="200" width="104" height="14" rx="2" fill="url(#tl)"/>
<rect x="-52" y="1220" width="104" height="14" rx="2" fill="url(#tl)"/>
<text y="1300" text-anchor="middle" font-size="34" font-weight="700" fill="#2B3036">Light-duty prop</text>
<text y="1338" text-anchor="middle" font-size="22" fill="#5F676E">Painted · quick pin adjustment</text>
</g>

<!-- 4 Cross-head galvanised prop with star base -->
<g transform="translate(1340,0)">
<ellipse cx="0" cy="1240" rx="94" ry="9" fill="#2B3036" opacity=".12"/>
<rect x="-14" y="134" width="28" height="436" fill="url(#gv)" stroke="#7F888F"/>
<g fill="#2B3036"><circle cy="200" r="5"/><circle cy="260" r="5"/><circle cy="320" r="5"/><circle cy="380" r="5"/><circle cy="440" r="5"/><circle cy="500" r="5"/></g>
<rect x="-22" y="556" width="44" height="84" fill="url(#gv)" stroke="#7F888F"/>
<rect x="-22" y="556" width="44" height="84" fill="url(#th)"/>
<line x1="-38" y1="532" x2="32" y2="532" stroke="#5F676E" stroke-width="7" stroke-linecap="round"/>
<path d="M32 532 C76 532 76 578 28 576" stroke="#5F676E" stroke-width="5" fill="none" stroke-linecap="round"/>
<rect x="-28" y="596" width="56" height="24" rx="4" fill="url(#gv)" stroke="#6E777E"/>
<path d="M28 608 L70 598" stroke="#8A9299" stroke-width="6" stroke-linecap="round"/><circle cx="72" cy="597" r="5" fill="#8A9299"/>
<rect x="-20" y="640" width="40" height="580" fill="url(#gv)" stroke="#7F888F"/>
<polygon points="-20,1220 -20,1180 -48,1220" fill="url(#gv)" stroke="#7F888F"/>
<polygon points="20,1220 20,1180 48,1220" fill="url(#gv)" stroke="#7F888F"/>
<rect x="-60" y="1218" width="120" height="14" rx="2" fill="url(#gv)" stroke="#7F888F"/>
<polygon points="-14,134 -14,166 -40,134" fill="url(#gv)" stroke="#7F888F"/>
<polygon points="14,134 14,166 40,134" fill="url(#gv)" stroke="#7F888F"/>
<rect x="-50" y="124" width="100" height="10" fill="url(#gv)" stroke="#7F888F"/>
<rect x="-50" y="96" width="10" height="30" fill="url(#gv)" stroke="#7F888F"/>
<rect x="40" y="96" width="10" height="30" fill="url(#gv)" stroke="#7F888F"/>
<text y="1300" text-anchor="middle" font-size="34" font-weight="700" fill="#2B3036">Cross-head prop</text>
<text y="1338" text-anchor="middle" font-size="22" fill="#5F676E">Galvanised · star base for stability</text>
</g>

<!-- Head options detail -->
<g transform="translate(1760,0)">
<rect x="-170" y="70" width="340" height="1172" rx="18" fill="#FFFFFF" stroke="#D5D8DA" stroke-width="2"/>
<text y="130" text-anchor="middle" font-size="26" font-weight="700" fill="#1E7F8C" letter-spacing="2">HEAD OPTIONS</text>
<line x1="-60" y1="150" x2="60" y2="150" stroke="#2FB3C6" stroke-width="3"/>
<!-- U-head -->
<g transform="translate(0,300) scale(2)">
<path d="M-52 -60 H-38 V-4 H38 V-60 H52 V8 H-52 Z" fill="url(#gv)" stroke="#7F888F" stroke-width=".8"/>
<rect x="-12" y="8" width="24" height="70" fill="url(#gv)" stroke="#7F888F" stroke-width=".8"/>
<circle cy="50" r="3.5" fill="#2B3036"/>
</g>
<text y="480" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3036">U-head</text>
<text y="514" text-anchor="middle" font-size="21" fill="#5F676E">Holds timber or H20 beams</text>
<text y="542" text-anchor="middle" font-size="21" fill="#5F676E">and steel bearers</text>
<line x1="-120" y1="600" x2="120" y2="600" stroke="#E1E6E9" stroke-width="2"/>
<!-- Flat head -->
<g transform="translate(0,720) scale(2)">
<rect x="-56" y="-28" width="112" height="14" rx="2" fill="url(#gv)" stroke="#7F888F" stroke-width=".8"/>
<circle cx="-40" cy="-21" r="3" fill="#7F888F"/><circle cx="40" cy="-21" r="3" fill="#7F888F"/>
<rect x="-12" y="-14" width="24" height="92" fill="url(#gv)" stroke="#7F888F" stroke-width=".8"/>
<circle cy="50" r="3.5" fill="#2B3036"/>
</g>
<text y="925" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3036">Flat head</text>
<text y="960" text-anchor="middle" font-size="21" fill="#5F676E">Square plate for slab</text>
<text y="988" text-anchor="middle" font-size="21" fill="#5F676E">soffits and back-propping</text>
<rect x="-130" y="1060" width="260" height="110" rx="12" fill="#EAF3F8"/>
<text y="1102" text-anchor="middle" font-size="22" font-weight="700" fill="#2B3036">Interchangeable</text>
<text y="1134" text-anchor="middle" font-size="20" fill="#5F676E">Choose the head</text>
<text y="1158" text-anchor="middle" font-size="20" fill="#5F676E">to suit the job</text>
</g>
</svg>
