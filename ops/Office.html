<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f12">
<title>Core Access · Office</title>
<style>
:root{
  --bg:#0b0f12; --bg2:#0f1519; --card:#141b20; --card2:#1a232a; --line:#26323b; --line2:#33424d;
  --text:#e7eef2; --muted:#8fa1ad; --dim:#5f707c;
  --teal:#14b8a6; --teal2:#2dd4bf; --tealbg:rgba(20,184,166,.12);
  --amber:#f59e0b; --amberbg:rgba(245,158,11,.12);
  --red:#f43f5e; --redbg:rgba(244,63,94,.12);
  --violet:#a78bfa; --violetbg:rgba(167,139,250,.12);
  --sky:#38bdf8; --skybg:rgba(56,189,248,.12);
  --orange:#fb923c; --orangebg:rgba(251,146,60,.12);
  --green:#4ade80; --greenbg:rgba(74,222,128,.12);
  --r:14px; --r2:10px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body{font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r2);
  border:1px solid transparent;font-weight:600;letter-spacing:.2px;cursor:pointer;transition:transform .06s,background .15s,border-color .15s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.inp:focus-visible,.tile:focus-visible,.iconbtn:focus-visible,.seg button:focus-visible{outline:2px solid var(--teal2);outline-offset:2px}
.btn-primary{background:linear-gradient(180deg,var(--teal2),var(--teal));color:#04201d;box-shadow:0 6px 18px rgba(20,184,166,.25)}
.btn-primary:hover{box-shadow:0 8px 24px rgba(20,184,166,.38)}
.btn-ghost{background:transparent;border-color:var(--line2);color:var(--text)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal2)}
.btn-danger{background:var(--redbg);border-color:rgba(244,63,94,.45);color:#fda4af}
.btn[disabled]{opacity:.5;cursor:default}
.btn-block{width:100%}
.btn-sm{height:34px;padding:0 11px;font-size:13px;border-radius:9px;gap:6px}
.btn-sm svg.i{width:16px;height:16px}
.spin{width:18px;height:18px;border:2.5px solid rgba(4,32,29,.25);border-top-color:#04201d;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--teal2);border-color:var(--teal)}

/* ---------- form fields ---------- */
.fld{display:block;margin-bottom:16px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.2px}
.fld>small{display:block;color:var(--dim);font-size:12px;margin-top:5px}
.inwrap{position:relative;display:flex;align-items:center}
.inwrap>svg.i{position:absolute;left:13px;color:var(--dim);pointer-events:none}
.inp{width:100%;height:46px;padding:0 14px 0 42px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--bg2);transition:border-color .15s,box-shadow .15s}
.inp.np{padding-left:14px}
textarea.inp{height:auto;min-height:84px;padding:10px 14px;resize:vertical;line-height:1.4}
.inp.sm{height:40px}
.inp[readonly]{color:var(--muted);background:var(--card)}
.inp::placeholder{color:var(--dim)}
.inp:hover{border-color:#41525e}
.inp:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--tealbg)}
.inp.bad{border-color:var(--red);box-shadow:0 0 0 3px var(--redbg)}
.eye{position:absolute;right:6px;width:36px;height:36px;border:0;background:none;color:var(--dim);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center}
.eye:hover{color:var(--teal2)}
.check{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;cursor:pointer;user-select:none;margin:4px 0 20px}
.check input{appearance:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);background:var(--bg2);display:grid;place-content:center;cursor:pointer;margin:0;flex:none}
.check input:checked{background:var(--teal);border-color:var(--teal)}
.check input:checked::after{content:"";width:10px;height:6px;border:2.5px solid #04201d;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

/* ---------- alerts ---------- */
.msg{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--r2);font-size:14px;margin-bottom:16px;border:1px solid}
.msg svg.i{width:18px;height:18px;margin-top:1px}
.msg.err{background:var(--redbg);border-color:rgba(244,63,94,.4);color:#fecdd3}
.msg.warn{background:var(--amberbg);border-color:rgba(245,158,11,.4);color:#fde68a}
.msg.ok{background:var(--tealbg);border-color:rgba(20,184,166,.4);color:#99f6e4}

/* ---------- login ---------- */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 16px;
  background:
    radial-gradient(900px 500px at 85% -10%,rgba(20,184,166,.16),transparent 60%),
    radial-gradient(700px 400px at -10% 110%,rgba(56,189,248,.08),transparent 60%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 72px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 72px),
    var(--bg)}
.lcard{width:100%;max-width:400px;background:linear-gradient(180deg,rgba(26,35,42,.92),rgba(20,27,32,.92));border:1px solid var(--line);border-radius:20px;padding:30px 26px 24px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--teal2),#0e7490);display:grid;place-items:center;color:#04201d;font-weight:800;letter-spacing:.5px;box-shadow:0 6px 18px rgba(20,184,166,.3)}
.brand b{display:block;font-size:18px;letter-spacing:.3px}
.brand small{color:var(--muted);font-size:13px}
.lcard h1{font-size:22px;margin:0 0 4px}
.lcard p.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
.foot{margin-top:18px;text-align:center;color:var(--dim);font-size:13px}
.demo{max-width:400px;margin:14px auto 0;padding:12px 14px;border:1px dashed var(--line2);border-radius:12px;color:var(--muted);font-size:13px}
.demo b{color:var(--text)}
.demo code{background:var(--card2);padding:1px 6px;border-radius:6px;color:var(--teal2);cursor:pointer}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:5;background:#05080a;border-bottom:1px solid #000}
.topin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.top .mark{width:36px;height:36px;border-radius:10px;font-size:13px}
.top .nm{font-weight:700;letter-spacing:.3px}
.top .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.sp{flex:1}
.who{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--teal2);border:1px solid var(--line2);flex:none}
.who .n{font-size:14px;font-weight:600;line-height:1.1}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-Admin{background:var(--tealbg);color:var(--teal2)}
.p-Accounts{background:var(--violetbg);color:var(--violet)}
.p-Yard,.p-Field{background:var(--amberbg);color:var(--amber)}
.p-Viewer{background:var(--skybg);color:var(--sky)}
.p-L1{background:var(--skybg);color:var(--sky)} .p-L2{background:var(--tealbg);color:var(--teal2)}
.p-L3{background:var(--amberbg);color:var(--amber)} .p-L4{background:var(--violetbg);color:var(--violet)}
.p-me{background:var(--tealbg);color:var(--teal2);margin-left:6px;vertical-align:1px}
.st-on{background:var(--greenbg);color:var(--green)} .st-off{background:var(--redbg);color:#fb7185}
.banner{background:linear-gradient(90deg,#0f766e,var(--teal));color:#effffd}
.banner .topin{padding:7px 16px;font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}
.main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.hello h2{margin:0;font-size:24px}
.hello p{margin:2px 0 0;color:var(--muted)}
.sec{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin:22px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .12s,border-color .15s,background .15s;min-height:118px}
.tile:hover{transform:translateY(-2px);border-color:var(--c,var(--teal));background:var(--card2)}
.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--cb,var(--tealbg));color:var(--c,var(--teal2))}
.tile .ic svg.i{width:22px;height:22px}
.tile b{font-size:16px}
.tile small{color:var(--muted);font-size:13px;margin-top:-6px}
.tile .soon{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--dim);border:1px solid var(--line2);padding:1px 6px;border-radius:999px}
.tile .soon.new{color:var(--c);border-color:var(--c)}
.t-teal{--c:var(--teal2);--cb:var(--tealbg)} .t-amber{--c:var(--amber);--cb:var(--amberbg)}
.t-violet{--c:var(--violet);--cb:var(--violetbg)} .t-sky{--c:var(--sky);--cb:var(--skybg)} .t-red{--c:#fb7185;--cb:var(--redbg)}
.t-orange{--c:var(--orange);--cb:var(--orangebg)} .t-green{--c:var(--green);--cb:var(--greenbg)}
.tile::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c,var(--teal))}
.dsec{margin-top:22px}
.dhead{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dcode{font-size:12px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:8px;background:var(--cb);color:var(--c)}
.dhead b{font-size:15px}
.dhead .lv{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line2);padding:1px 7px;border-radius:999px}
.dhead small{margin-left:auto;color:var(--dim);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 4px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--teal))}
.chip.on{border-color:var(--c,var(--teal));color:var(--text);background:var(--cb,var(--tealbg))}
.chip:focus-visible{outline:2px solid var(--teal2);outline-offset:2px}

/* ---------- users & access (HR) ---------- */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1;min-width:180px}
.bar .inp.sm{padding-left:40px}
.cnt{color:var(--muted);font-size:13px;margin:10px 0 12px}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.ucard.off{border-style:dashed;background:var(--bg2)}
.ucard.off .uh .n{color:var(--muted)}
.uh{display:flex;align-items:center;gap:10px}
.uh .n{font-weight:700}
.uh small{display:block;color:var(--muted);font-size:13px;word-break:break-all}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.db{font-size:11px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:7px;background:var(--cb,var(--card2));color:var(--c,var(--muted))}
.db em{font-style:normal;font-weight:600;opacity:.85;margin-left:5px;letter-spacing:.2px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;color:var(--muted)}
.meta b{color:var(--text);font-weight:600}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:7px;box-shadow:0 0 0 3px var(--greenbg);vertical-align:1px}
.acts{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.empty{color:var(--muted);padding:30px 16px;text-align:center;border:1px dashed var(--line2);border-radius:var(--r);grid-column:1/-1}

/* ---------- dialog (bottom sheet on phones) ---------- */
.dlgw{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.dlg{width:100%;max-width:580px;max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:18px 18px 0 0;padding:20px 18px 18px;box-shadow:var(--shadow)}
.dlg h3{margin:0 0 4px;font-size:19px}
.dlg p.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.dfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:2px 0 6px}
.drow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.drow .dn{flex:1;min-width:130px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{height:34px;padding:0 11px;border:0;background:var(--bg2);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;border-left:1px solid var(--line2)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--cb,var(--tealbg));color:var(--c,var(--teal2))}
.seg button[data-v="0"].on{background:var(--card2);color:var(--text)}
.note{font-size:13px;color:var(--muted);margin-top:12px;display:flex;gap:8px;align-items:flex-start}
.note svg.i{width:16px;height:16px;margin-top:2px}
.pwbox{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:24px;letter-spacing:2px;padding:14px;border-radius:12px;background:var(--bg2);border:1px dashed var(--teal);text-align:center;color:var(--teal2);user-select:all;word-break:break-all;margin:4px 0 12px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--card2);border:1px solid var(--line2);color:var(--text);padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);transition:.2s;z-index:40;font-size:14px;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- QHSE › document register ---------- */
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:9px;position:relative}
.dcard::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c,var(--teal))}
.dcard.wd{border-style:dashed;background:var(--bg2)} .dcard.wd .dt{color:var(--muted);text-decoration:line-through}
.dc{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700;font-size:14px;color:var(--c,var(--teal2));letter-spacing:.4px}
.dt{font-weight:700;font-size:15px}
.dtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtop .sp{flex:1}
.st-Active{background:var(--greenbg);color:var(--green)} .st-Draft{background:var(--amberbg);color:var(--amber)} .st-Withdrawn{background:var(--redbg);color:#fb7185}
.ty{background:var(--card2);color:var(--muted)}
.fpv{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;color:var(--muted);background:var(--bg2);border:1px dashed var(--line2);border-radius:8px;padding:6px 8px;word-break:break-word}
.fpv b{color:var(--text);font-weight:600}
.hist{list-style:none;margin:0;padding:0;border-left:2px solid var(--line2)}
.hist li{position:relative;padding:0 0 14px 16px;font-size:14px}
.hist li::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--green)}
.hist li small{display:block;color:var(--muted);font-size:12.5px}
.ro{font-size:13px;color:var(--muted);margin:-4px 0 12px;display:flex;gap:8px;align-items:center}
.ro svg.i{width:16px;height:16px}
.segw{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:560px){.dlist{grid-template-columns:1fr}}

@media (min-width:600px){
  .dlgw{align-items:center;padding:20px}
  .dlg{border-radius:18px;padding:22px 22px 20px}
}
@media (max-width:560px){
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{min-height:108px;padding:14px}
  .tile small{display:none}
  .who .n,.who .pill{display:none}
  .hello h2{font-size:21px}
  .top .nm small{display:none}
  .dhead small{display:none}
  .ulist{grid-template-columns:1fr}
  .seg button{padding:0 9px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ======================= icons ======================= */
var I = {
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',

  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>',
  logout:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
  doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  building:'<path d="M4 21V5l8-3v19M12 9h8v12M7 8h2M7 12h2M7 16h2M15 13h2M15 17h2M2 21h20"/>',
  brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M3 13h18"/>',
  truck:'<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  ret:'<path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',
  box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',

function doLogin(){
  if(LBUSY) return;
  var em=document.getElementById('em'),pw=document.getElementById('pw'),go=document.getElementById('go');
  em.classList.remove('bad');pw.classList.remove('bad');
  var e=em.value.trim(),p=pw.value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){em.classList.add('bad');showMsg('err','Enter a valid email address.');em.focus();return;}
  if(!p){pw.classList.add('bad');showMsg('err','Enter your password.');pw.focus();return;}
  go.disabled=true;go.innerHTML='<span class="spin"></span> Signing in…';
  var keep=document.getElementById('keep').checked, my=++LSEQ; LBUSY=true;

    S.token=r.token;S.user=nu(r.user);tokSet(r.token,keep);viewHome();
  },function(m){

    else if(k[0]==='BUSY') showMsg('warn','Too many sign-in attempts right now. Please wait a minute and try again.');

    else if(k[0]==='BAD'){pw.classList.add('bad');showMsg('err','Wrong email or password.'+(+k[1]<=2?' <b>'+esc(k[1])+'</b> '+(k[1]==='1'?'try':'tries')+' left before a 15 min lock.':''));pw.select();}

function cleanAccess(m){
  if(!m||typeof m!=='object'||Array.isArray(m)) return null;
  var o={},n=0;
  DEPTS.forEach(function(D){var v=m[D.d];if(typeof v==='number'&&v>=1&&v<=4&&v===Math.floor(v)){o[D.d]=v;n++;}});
  return n?o:null;
}

function topLevel(a){var t=0;for(var k in a)if(a[k]>t)t=a[k];return t;}

function seesMoney(a){return isDirector(a)||['SC','PR','AC'].some(function(d){return (a&&a[d]||0)>=1;});}

/* a dead session goes back to sign-in; no access goes Home; the rest is text for the screen */
function srvGate(m){
  var k=code(m).split('|')[0];
  if(k==='NOSESSION'){S={token:null,user:null};tokClear();viewLogin('<div class="msg warn">'+ic('alert')+'<div>Your sign-in has ended. Please sign in again.</div></div>');return true;}
  if(k==='NOACCESS'){viewHome();toast('You do not have access to that screen.');return true;}
  return false;
}
function errText(m){
  var k=code(m).split('|');
  switch(k[0]){
    case 'DUP': return 'This email already has a login. Find it in the list and use <b>Edit</b>.';
    case 'LASTDIR': return 'There must always be at least one <b>enabled Director</b>. Make another Director first.';
    case 'SELF': return 'You can\'t block yourself or change your own access. Ask another Director.';
    case 'BADINPUT': return 'Please check the <b>'+esc(k[1]||'fields')+'</b>.';
    case 'NOTFOUND': return 'This no longer exists (or is not yours to see). The list has been refreshed.';
    case 'BUSY': return 'The server is busy. Please try again in a moment.';
    case 'STALE': return 'Someone changed this document a moment ago. The list has been refreshed — please check and try again.';
    case 'WITHDRAWN': return 'This document is <b>withdrawn</b>. Make it active again before revising it.';
    case 'NOREG': return 'The document register is not set up yet. A Director runs <b>Web app › Set up document register</b> in the sheet.';
    case 'SYSDOC': return 'The system prints this document, so it can\'t be withdrawn. Revise it instead.';
    default: return 'Could not finish: '+esc(code(m));
  }
}

var DLG={seq:0,busy:false,prev:null};
function closeDlg(){
  var w=document.getElementById('dlg');DLG.seq++;DLG.busy=false;

}
function openDlg(html){

/* yes / no question; run() returns a promise; done(result) runs after success */
function askDlg(title,text,okLabel,danger,run,done,reload){
  var my=openDlg('<h3 id="dlgt">'+title+'</h3><p class="sub">'+text+'</p><div id="derr"></div>'+
    '<div class="dfoot"><button type="button" class="btn btn-ghost" id="dno">Cancel</button>'+
    '<button type="button" class="btn '+(danger?'btn-danger':'btn-primary')+'" id="dyes">'+okLabel+'</button></div>');
  var yes=document.getElementById('dyes');
  document.getElementById('dno').onclick=function(){if(!DLG.busy)closeDlg();};
  yes.onclick=function(){
    if(DLG.busy)return;DLG.busy=true;busyBtn(yes,true,'Working…');dlgErr('');
    run().then(function(r){if(my!==DLG.seq)return;DLG.busy=false;closeDlg();done(r);},
      function(m){if(my!==DLG.seq)return;DLG.busy=false;if(srvGate(m))return;busyBtn(yes,false);dlgErr(errText(m));var k0=code(m).split('|')[0];if(k0==='NOTFOUND'||k0==='STALE')(reload||usersLoad)();});
  };

}

/* ======================= screen: QHSE › Document register (D1) ======================= */
/* every QH login reads it; QHSE Head (L3) or Director adds, revises, approves, withdraws. Records are add-only: the history is never edited. */
var DR={rows:[],can:false,today:'',depts:[],setup:true,q:'',f:'',st:'',seq:0};
var DTYPES=['Form','Procedure','Record'], DSTAT=['Active','Draft','Withdrawn'];
var RECEX={Quote:'CAE/Q/2026/002',PI:'CAE/PI/2026/001',Invoice:'CAE/INV/2026/001',Note:'CAE/DN/2026/001',Challan:'CAE/DC/2026/001',PO:'CAE/PO/2026/001'};
function deptOf(c){var o=null;DEPTS.forEach(function(D){if(D.d===c)o=D;});return o;}
function isDay(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);}
function fmtDay(s){if(!isDay(s))return '—';var p=s.split('-');return (+p[2])+' '+MON[(+p[1]-1)%12]+' '+p[0];}
function ndoc(r){
  r=r||{};var rev=+r.rev;
  return {code:String(r.code||''),title:String(r.title||'—'),dept:deptOf(r.dept)?r.dept:'',type:DTYPES.indexOf(r.type)>=0?r.type:'Form',
    rev:(rev>=0&&rev===Math.floor(rev))?rev:0,revDate:isDay(r.revDate)?r.revDate:'',owner:String(r.owner||''),
    status:DSTAT.indexOf(r.status)>=0?r.status:'Draft',sys:RECEX[r.sys]?String(r.sys):'',issued:(+r.issued>0)?Math.floor(+r.issued):0,
    hist:(Array.isArray(r.hist)?r.hist:[]).map(function(h){h=h||{};return {rev:+h.rev||0,date:isDay(h.date)?h.date:'',by:String(h.by||'—'),note:String(h.note||'')};})};
}
function footerTxt(d){return '<b>'+esc(d.code)+'</b> · Rev '+d.rev+' · '+esc(fmtDay(d.revDate))+' · Page 1 / 2 · '+(d.sys?esc(RECEX[d.sys]):'record no.');}
function viewDocs(){
  document.title='Core Access · Document register';
  DR.q='';DR.f='';DR.st='';
  var body='<div class="bar"><button type="button" class="btn btn-ghost btn-sm" id="back">'+ic('back')+' Home</button>'+
    '<div class="inwrap grow">'+ic('search')+'<input class="inp sm" id="dq" type="search" placeholder="Search code, title or owner" autocomplete="off" aria-label="Search documents"></div>'+
    '<span id="dadd"></span></div>'+
    '<div id="dro"></div><div class="chips" id="df" role="group" aria-label="Department"></div>'+
    '<div style="margin:10px 0 0"><span class="seg t-green" id="dst" role="radiogroup" aria-label="Status">'+['','Active','Draft','Withdrawn'].map(function(s){
      return '<button type="button" role="radio" data-s="'+s+'" aria-checked="'+(s==='')+'"'+(s===''?' class="on"':'')+'>'+(s||'All')+'</button>';}).join('')+'</span></div>'+
    '<p class="cnt" id="dcnt">&nbsp;</p><div id="dlist" class="dlist"><div class="empty">Loading the register…</div></div>';
  shell('QHSE · Document register',body);

  document.getElementById('dst').onclick=function(e){var b=e.target.closest?e.target.closest('button[data-s]'):null;if(!b)return;DR.st=b.getAttribute('data-s');
    [].forEach.call(this.children,function(x){var on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-checked',on);});docsDraw();};
  document.getElementById('df').onclick=function(e){var b=e.target.closest?e.target.closest('.chip'):null;if(!b)return;DR.f=b.getAttribute('data-f');docsChips();docsDraw();};
  document.getElementById('dlist').onclick=function(e){
    var b=e.target.closest?e.target.closest('[data-a]'):null;if(!b||b.disabled)return;
    var c=b.closest('.dcard').getAttribute('data-c'),d=null;DR.rows.forEach(function(x){if(x.code===c)d=x;});
    if(d) docAct(b.getAttribute('data-a'),d);
  };

function docsLoad(){
  var my=++DR.seq;
  call('officeDocList',S.token).then(function(r){
    if(my!==DR.seq||!document.getElementById('dlist'))return;
    DR.can=!!(r&&r.can===true);DR.today=isDay(r&&r.today)?r.today:'';DR.setup=!(r&&r.setup===false);
    DR.depts=(r&&Array.isArray(r.depts)?r.depts:[]).filter(function(x){return !!deptOf(x);});
    DR.rows=(r&&Array.isArray(r.rows)?r.rows:[]).map(ndoc).filter(function(d){return d.code;});
    var ord=function(d){for(var i=0;i<DEPTS.length;i++)if(DEPTS[i].d===d.dept)return i;return 99;};
    DR.rows.sort(function(a,b){return (ord(a)-ord(b))||a.code.localeCompare(b.code);});
    if(!DR.depts.length)DR.can=false;
    document.getElementById('dadd').innerHTML=DR.can&&DR.setup?'<button type="button" class="btn btn-primary btn-sm" id="dnew">'+ic('plus')+' Add document</button>':'';
    if(DR.can&&DR.setup) document.getElementById('dnew').onclick=function(){docEdit(null);};
    document.getElementById('dro').innerHTML=DR.can?'':'<p class="ro">'+ic('eye')+'View only — a QHSE Head or a Director adds and revises documents.</p>';
    docsChips();docsDraw();
  },function(m){
    if(my!==DR.seq||!document.getElementById('dlist'))return;
    if(srvGate(m))return;
    document.getElementById('dlist').innerHTML='<div class="empty">Could not load the register: '+esc(code(m))+' <button type="button" class="btn btn-ghost btn-sm" id="dretry">Try again</button></div>';
    document.getElementById('dretry').onclick=docsLoad;
  });
}
function docsChips(){
  var el=document.getElementById('df');if(!el)return;
  var ds=DEPTS.filter(function(D){return DR.rows.some(function(d){return d.dept===D.d;});});
  if(DR.f&&!ds.some(function(D){return D.d===DR.f;}))DR.f='';
  el.innerHTML='<button type="button" class="chip'+(DR.f?'':' on')+'" data-f="" aria-pressed="'+!DR.f+'">All</button>'+ds.map(function(D){

function docsDraw(){

      '<div class="dtop"><span class="dc">'+esc(d.code)+'</span><span class="pill ty">'+esc(d.type)+'</span><span class="sp"></span><span class="pill st-'+d.status+'">'+d.status+'</span></div>'+
      '<div class="dt">'+esc(d.title)+'</div>'+
      '<div class="meta"><span>Revision</span><b>Rev '+d.rev+' · '+esc(fmtDay(d.revDate))+'</b>'+
        '<span>Department</span><b>'+esc(D.d)+(D.n?' · '+esc(D.n):'')+'</b>'+
        '<span>Owner</span><b>'+(d.owner?esc(d.owner):'—')+'</b>'+
        '<span>Made by</span><b>'+(d.sys?'System — auto PDF · '+d.issued+' issued':'By hand (not in the system yet)')+'</b></div>'+
      '<div class="fpv" title="Footer printed on every page">PDF footer: '+footerTxt(d)+'</div>'+

  }).join('');

    document.getElementById('edept').onclick=function(e){var b=e.target.closest?e.target.closest('[data-v]'):null;if(!b)return;dept=b.getAttribute('data-v');segOn(this,b);showCode();};
    document.getElementById('etype').onclick=function(e){var b=e.target.closest?e.target.closest('[data-v]'):null;if(!b)return;type=b.getAttribute('data-v');segOn(this,b);showCode();};
    document.getElementById('estat').onclick=function(e){var b=e.target.closest?e.target.closest('[data-v]'):null;if(!b)return;status=b.getAttribute('data-v');segOn(this,b);};
    showCode();
  }
  document.getElementById('ecan').onclick=function(){if(!DLG.busy)closeDlg();};
  var doSave=function(){
    if(DLG.busy)return;ti.classList.remove('bad');dlgErr('');
    var t=ti.value.trim();if(!t){ti.classList.add('bad');dlgErr('Enter the title.');ti.focus();return;}
    DLG.busy=true;busyBtn(save,true,'Saving…');
    call('officeDocSave',S.token,isNew?{isNew:true,dept:dept,type:type,title:t,owner:ow.value.trim(),status:status}:{code:d.code,rev:d.rev,was:d.status,title:t,owner:ow.value.trim()}).then(function(r){
      if(my!==DLG.seq)return;DLG.busy=false;closeDlg();docsLoad();
      toast(isNew?'Added '+String(r&&r.code||'')+'.':(r&&r.same?'Nothing changed.':'Saved.'));
    },function(m){
      if(my!==DLG.seq)return;DLG.busy=false;if(srvGate(m))return;busyBtn(save,false);
      var k=code(m).split('|');if(k[0]==='BADINPUT'&&k[1]==='title')ti.classList.add('bad');
      dlgErr(errText(m));if(k[0]==='NOTFOUND'||k[0]==='STALE')docsLoad();
    });
  };
  save.onclick=doSave;
  [ti,ow].forEach(function(x){x.onkeydown=function(ev){if(ev.key==='Enter'&&!ev.isComposing){ev.preventDefault();doSave();}};});
  setTimeout(function(){if(my===DLG.seq)ti.focus();},30);
}
/* revise = Rev +1 with what changed and the issue date; earlier PDFs keep their old Rev */
function docRevise(d){
  var my=openDlg('<h3 id="dlgt">Revise '+esc(d.code)+'</h3><p class="sub">'+esc(d.title)+': Rev '+d.rev+' → <b>Rev '+(d.rev+1)+'</b></p><div id="derr"></div>'+
    '<label class="fld"><span>What changed</span><textarea class="inp np" id="rnote" maxlength="300" rows="3" placeholder="e.g. Clause 4.1: advance 50 % → 40 %"></textarea><small>Ctrl + Enter saves.</small></label>'+
    '<label class="fld"><span>Issue date</span><input class="inp np" id="rdate" type="date" value="'+esc(DR.today)+'"></label>'+
    '<div class="note">'+ic('alert')+'<div>PDFs made before keep <b>Rev '+d.rev+'</b> in their footer; new PDFs print <b>Rev '+(d.rev+1)+'</b>. The history entry can\'t be edited later.</div></div>'+
    '<div class="dfoot"><button type="button" class="btn btn-ghost" id="rcan">Cancel</button><button type="button" class="btn btn-primary" id="rsave">Save Rev '+(d.rev+1)+'</button></div>');
  var no=document.getElementById('rnote'),dt=document.getElementById('rdate'),save=document.getElementById('rsave');
  document.getElementById('rcan').onclick=function(){if(!DLG.busy)closeDlg();};
  var doSave=function(){
    if(DLG.busy)return;no.classList.remove('bad');dt.classList.remove('bad');dlgErr('');
    var n=no.value.trim(),v=dt.value;
    if(!n){no.classList.add('bad');dlgErr('Say what changed.');no.focus();return;}
    if(!isDay(v)){dt.classList.add('bad');dlgErr('Pick the issue date.');dt.focus();return;}
    DLG.busy=true;busyBtn(save,true,'Saving…');
    call('officeDocRevise',S.token,d.code,d.rev,n,v).then(function(r){
      if(my!==DLG.seq)return;DLG.busy=false;closeDlg();docsLoad();toast(d.code+' is now Rev '+(+(r&&r.rev)||d.rev+1)+'.');
    },function(m){
      if(my!==DLG.seq)return;DLG.busy=false;if(srvGate(m))return;busyBtn(save,false);
      var k=code(m).split('|');if(k[0]==='BADINPUT'&&k[1]==='date')dt.classList.add('bad');if(k[0]==='BADINPUT'&&k[1]==='what changed')no.classList.add('bad');
      dlgErr(errText(m));if(k[0]==='NOTFOUND'||k[0]==='STALE')docsLoad();
    });
  };
  save.onclick=doSave;
  no.onkeydown=function(ev){if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();doSave();}};
  dt.onkeydown=function(ev){if(ev.key==='Enter'){ev.preventDefault();doSave();}};
  setTimeout(function(){if(my===DLG.seq)no.focus();},30);
}

/* ======================= start ======================= */
(function start(){
  var t=tokGet();
  if(!t) return viewLogin();
  call('officeMe',t).then(function(u){S.token=t;S.user=nu(u);viewHome();},function(m){
    /* only a dead session clears the saved sign-in; a network / server hiccup keeps it for the next try */
    if(code(m)==='NOSESSION'){tokClear();viewLogin();}
    else viewLogin('<div class="msg warn">'+ic('alert')+'<div>Could not check your sign-in just now. <b>Reload</b> to try again, or sign in below.</div></div>');
  });
})();
</script>
